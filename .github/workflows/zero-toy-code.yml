# Zero-Toy-Code gate.
#
# Runs the repository scanner, the agent-prompt parity check, and the
# behavioural test suites on every push and pull request. A finding, parity
# drift, or failing suite fails the job, so unfinished or non-production code
# never reaches the default branch.
name: zero-toy-code

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"
      - name: Run the Zero-Toy-Code gate
        run: ./setup.sh scan
