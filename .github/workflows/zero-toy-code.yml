---
# Zero-Toy-Code gate.
#
# `gate` runs every offline repository gate through `./setup.sh scan`: the
# Zero-Toy-Code scanner, ruff (format and lint), mypy strict, pytest with 100%
# branch coverage, ShellCheck, the shell test suites, prompt parity,
# actionlint, yamllint and gitleaks. On pull requests it also requires every
# changed line to be covered. `dependency-audit` checks the hash-pinned
# toolchain against the PyPI vulnerability service.
#
# Third-party actions are pinned to commit SHAs resolved from their release
# tags (git ls-remote): actions/checkout v7.0.1, actions/setup-python v7.1.0.
name: zero-toy-code

"on":
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: zero-toy-code-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # actions/checkout v7.0.1
      - name: Check out the repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      # actions/setup-python v7.1.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Install gitleaks
        run: sudo apt-get update -q && sudo apt-get install -y -q gitleaks
      - name: Build the hash-verified gate toolchain
        run: ./setup.sh toolchain
      - name: Run every offline gate
        run: ./setup.sh scan
      - name: Require coverage of every changed line
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: >-
          .venv/bin/diff-cover coverage.xml
          --compare-branch="origin/${BASE_REF}" --fail-under=100

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # actions/checkout v7.0.1
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.1.0
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13"
      - name: Build the hash-verified gate toolchain
        run: ./setup.sh toolchain
      - name: Audit the pinned toolchain for known vulnerabilities
        run: ./setup.sh audit-deps
